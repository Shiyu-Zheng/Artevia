<div class="shell">
  <div class="head">
    <div class="eyebrow">Get in touch</div>
    <h1>Send a message.</h1>
  </div>

  <!-- Deliberately a plain HTML form: no Formspree script, no CAPTCHA. Nothing
       is requested from their servers until someone presses send, which is what
       keeps the privacy policy's "no third-party requests" line true for anyone
       simply reading the page. Don't add their JS embed later without changing
       that sentence too. -->

  <form class="enquiry" action="https://formspree.io/f/moeaapbn" method="POST">

    <input type="hidden" name="_subject" value="ArteVia enquiry">
    <!-- honeypot: bots fill it, people never see it. No third-party spam service. -->
    <p class="hp"><label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></p>

    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="org">Organisation <span class="opt">optional</span></label>
      <input type="text" id="org" name="organisation" autocomplete="organization">
    </div>

    <div class="field">
      <label for="about">What's this about?</label>
      <select id="about" name="about">
        <option>A concert, tour or project coming up</option>
        <option>Ongoing help, week to week</option>
        <option>Getting systems and files in order</option>
        <option>Not sure yet</option>
      </select>
    </div>

    <div class="field">
      <label for="message">What's taking up your time?</label>
      <textarea id="message" name="message" rows="7" required></textarea>
    </div>

    <button type="submit">Send it</button>

  </form>

  <p class="enquiry-alt">Rather book a call? <a href="https://calendly.com/hello-shiyuzheng/30min" target="_blank" rel="noopener">Find a time →</a></p>

</div>

</div>
